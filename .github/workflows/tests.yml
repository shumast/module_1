name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Task 0.1
        run: pytest -m task0_1

      - name: Task 0.2
        run: pytest -m task0_2

      - name: Task 0.3
        run: pytest -m task0_3

      - name: Task 0.4
        run: pytest -m task0_4

      - name: Task 1.1
        run: pytest -m task1_1

      - name: Task 1.2
        run: pytest -m task1_2

      - name: Task 1.3
        run: pytest -m task1_3

      - name: Task 1.4
        run: pytest -m task1_4

      - name: All tests
        run: pytest
